<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyFinanceTracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-lg space-y-4">
    <!-- Header -->
    <header class="text-center py-2">
      <h1 class="text-2xl font-bold text-emerald-400">MyFinanceTracker</h1>
      <p class="text-xs text-slate-400">Personal & Mess Expense Manager</p>
    </header>

    <!-- Nav Tabs (Clickable) -->
    <div class="flex overflow-x-auto gap-2 pb-1 text-xs font-semibold no-scrollbar">
      <button onclick="setTab('All')" id="tab-All" class="px-3.5 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold transition">All Records</button>
      <button onclick="setTab('Mess')" id="tab-Mess" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Mess</button>
      <button onclick="setTab('Personal')" id="tab-Personal" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Personal</button>
      <button onclick="setTab('Loan')" id="tab-Loan" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Loans</button>
      <button onclick="setTab('Payables')" id="tab-Payables" class="px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Payables</button>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-800/90 border border-slate-700/60 p-4 rounded-2xl">
        <span class="text-[11px] text-slate-400 uppercase tracking-wider" id="summaryTitle">Total (All)</span>
        <div class="text-2xl font-bold text-emerald-400 mt-1" id="totalDisplay">₹0</div>
      </div>
      <div class="bg-slate-800/90 border border-slate-700/60 p-4 rounded-2xl">
        <span class="text-[11px] text-slate-400 uppercase tracking-wider">Entries Count</span>
        <div class="text-2xl font-bold text-sky-400 mt-1" id="countDisplay">0</div>
      </div>
    </div>

    <!-- Add Entry Form (Fully Working) -->
    <div class="bg-slate-800/90 border border-slate-700/60 p-4 rounded-2xl space-y-3">
      <h2 class="text-sm font-semibold text-slate-200">Add New Expense / Entry</h2>
      
      <input id="itemTitle" type="text" placeholder="Title (e.g. Chana, Room Rent, Recharge)" 
        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
      
      <div class="grid grid-cols-2 gap-2">
        <input id="itemAmount" type="number" placeholder="Amount (₹)" 
          class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-white">
        
        <select id="itemCategory" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
          <option value="Mess">Mess</option>
          <option value="Personal">Personal</option>
          <option value="Loan">Loan</option>
          <option value="Payables">Payables</option>
        </select>
      </div>

      <button onclick="addNewEntry()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition active:scale-95 shadow-lg shadow-emerald-500/20">
        + Save Entry
      </button>
    </div>

    <!-- Entry List View -->
    <div class="bg-slate-800/90 border border-slate-700/60 p-4 rounded-2xl space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-sm font-semibold text-slate-200" id="listHeading">Recent Entries</h3>
        <button onclick="clearCurrentCategory()" class="text-[11px] text-red-400 hover:underline">Clear</button>
      </div>

      <div id="entriesList" class="space-y-2 text-sm">
        <!-- Records render here -->
      </div>
    </div>
  </div>

  <script>
    // LocalStorage Data Setup
    let data = JSON.parse(localStorage.getItem('mft_user_records')) || [];
    let currentCategory = 'All';

    function setTab(cat) {
      currentCategory = cat;

      // Update Active Tab Button Styling
      ['All', 'Mess', 'Personal', 'Loan', 'Payables'].forEach(c => {
        const btn = document.getElementById('tab-' + c);
        if (btn) {
          if (c === cat) {
            btn.className = "px-3.5 py-2 rounded-xl bg-emerald-500 text-slate-950 font-bold transition";
          } else {
            btn.className = "px-3.5 py-2 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
          }
        }
      });

      renderApp();
    }

    function renderApp() {
      const list = document.getElementById('entriesList');
      const totalDisplay = document.getElementById('totalDisplay');
      const countDisplay = document.getElementById('countDisplay');
      const summaryTitle = document.getElementById('summaryTitle');
      const listHeading = document.getElementById('listHeading');

      list.innerHTML = '';

      // Filter based on active tab
      const filtered = currentCategory === 'All' 
        ? data 
        : data.filter(item => item.category === currentCategory);

      let total = 0;
      filtered.forEach(item => total += Number(item.amount));

      summaryTitle.innerText = `Total (${currentCategory})`;
      totalDisplay.innerText = '₹' + total.toLocaleString('en-IN');
      countDisplay.innerText = filtered.length;
      listHeading.innerText = `${currentCategory} Entries (${filtered.length})`;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="text-center text-slate-500 text-xs py-6">Koi entry nahi hai. Naya amount add karein!</div>`;
        return;
      }

      filtered.forEach(item => {
        const indexInMain = data.findIndex(d => d.id === item.id);
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center bg-slate-900/80 p-3 rounded-xl border border-slate-700/50';
        div.innerHTML = `
          <div>
            <div class="font-medium text-slate-200 text-sm">${item.title}</div>
            <div class="text-[10px] text-slate-400 uppercase tracking-wider">${item.category} • ${item.date}</div>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold text-emerald-400">₹${Number(item.amount).toLocaleString('en-IN')}</span>
            <button onclick="deleteSingleEntry(${indexInMain})" class="text-red-400 hover:text-red-300 font-bold text-base px-1">✕</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function addNewEntry() {
      const titleInput = document.getElementById('itemTitle');
      const amountInput = document.getElementById('itemAmount');
      const categorySelect = document.getElementById('itemCategory');

      const title = titleInput.value.trim();
      const amount = amountInput.value.trim();
      const category = categorySelect.value;

      if (!title || !amount || Number(amount) <= 0) {
        alert('Kripya valid description aur amount daliye!');
        return;
      }

      const today = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });

      data.unshift({
        id: Date.now(),
        title: title,
        amount: Number(amount),
        category: category,
        date: today
      });

      localStorage.setItem('mft_user_records', JSON.stringify(data));

      titleInput.value = '';
      amountInput.value = '';

      renderApp();
    }

    function deleteSingleEntry(index) {
      data.splice(index, 1);
      localStorage.setItem('mft_user_records', JSON.stringify(data));
      renderApp();
    }

    function clearCurrentCategory() {
      if (confirm(`Kya aap ${currentCategory} ke saare records clear karna chahte hain?`)) {
        if (currentCategory === 'All') {
          data = [];
        } else {
          data = data.filter(item => item.category !== currentCategory);
        }
        localStorage.setItem('mft_user_records', JSON.stringify(data));
        renderApp();
      }
    }

    // Run on initial load
    renderApp();
  </script>
</body>
  </html>
