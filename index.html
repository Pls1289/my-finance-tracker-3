<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Finance Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">
  <div class="max-w-md mx-auto space-y-4">
    
    <header class="text-center py-2">
      <h1 class="text-2xl font-bold tracking-wide text-emerald-400">Finance Tracker</h1>
      <p class="text-xs text-slate-400">Monthly Expense & Mess Tracker</p>
    </header>

    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <span class="text-xs text-slate-400">Total Spent</span>
        <div id="totalExpense" class="text-xl font-bold text-emerald-400 mt-1">₹0</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <span class="text-xs text-slate-400">Total Entries</span>
        <div id="recordCount" class="text-xl font-bold text-sky-400 mt-1">0</div>
      </div>
    </div>

    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
      <h2 class="text-sm font-semibold text-slate-200">New Entry</h2>
      <input id="title" type="text" placeholder="Title (e.g. Mess, Market, Recharge)" 
        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
      
      <div class="grid grid-cols-2 gap-2">
        <input id="amount" type="number" placeholder="Amount (₹)" 
          class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
        <select id="category" class="bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-300 focus:outline-none focus:border-emerald-500">
          <option value="Mess">Mess</option>
          <option value="Personal">Personal</option>
          <option value="Loan">Loan</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <button onclick="addEntry()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">
        Save Entry
      </button>
    </div>

    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
      <h2 class="text-sm font-semibold text-slate-200 mb-3">Recent Records</h2>
      <div id="list" class="space-y-2 text-sm"></div>
    </div>

  </div>

  <script>
    let entries = JSON.parse(localStorage.getItem('my_expenses')) || [];

    function render() {
      const list = document.getElementById('list');
      const totalEl = document.getElementById('totalExpense');
      const countEl = document.getElementById('recordCount');

      list.innerHTML = '';
      let total = 0;

      if (entries.length === 0) {
        list.innerHTML = '<p class="text-center text-slate-500 text-xs py-4">No records yet.</p>';
      }

      entries.forEach((item, index) => {
        total += Number(item.amount);
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-700';
        div.innerHTML = `
          <div>
            <div class="font-medium text-slate-200">${item.title}</div>
            <div class="text-[10px] text-slate-400 uppercase tracking-wider">${item.category}</div>
          </div>
          <div class="flex items-center gap-3">
            <span class="font-bold text-emerald-400">₹${item.amount}</span>
            <button onclick="deleteEntry(${index})" class="text-red-400 text-xs font-bold px-1">✕</button>
          </div>
        `;
        list.appendChild(div);
      });

      totalEl.innerText = '₹' + total;
      countEl.innerText = entries.length;
    }

    function addEntry() {
      const title = document.getElementById('title').value.trim();
      const amount = document.getElementById('amount').value.trim();
      const category = document.getElementById('category').value;

      if (!title || !amount || Number(amount) <= 0) {
        alert('Please enter valid title and amount');
        return;
      }

      entries.unshift({ title, amount: Number(amount), category });
      localStorage.setItem('my_expenses', JSON.stringify(entries));

      document.getElementById('title').value = '';
      document.getElementById('amount').value = '';
      render();
    }

    function deleteEntry(index) {
      entries.splice(index, 1);
      localStorage.setItem('my_expenses', JSON.stringify(entries));
      render();
    }

    render();
  </script>
</body>
        </html>
